[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-automate"
version = "0.1.0"
description = "Generate job-tailored LaTeX CVs from one master profile"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
cv = "cv_automate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
